version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - errorlint
    - forbidigo
    - sloglint
    - tagalign
    - depguard
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/stretchr/testify
              desc: Use standard assertions or cmp
            - pkg: github.com/zekihan/go-commons
              desc: Construct application dependencies explicitly
    forbidigo:
      forbid:
        - pattern: ^log\.Print.*$
          msg: Use structured slog logging
        - pattern: ^log\.Fatal.*$
          msg: Return errors to main
        - pattern: ^context\.TODO$
          msg: Propagate a real context
        - pattern: ^os\.Exit$
          msg: Only main may exit the process
    sloglint:
      attr-only: true
      context: scope
    tagalign:
      align: true
      sort: true
  exclusions:
    rules:
      - path: main.go
        linters: [forbidigo]
      - path: _test.go
        linters: [errcheck]
      - path: internal/testutil/
        linters: [errcheck]
formatters:
  enable: [gofmt, gci, golines]
  settings:
    golines:
      max-len: 100
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/zekihan/external-secrets-sops)
