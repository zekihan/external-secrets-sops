server:
  address: 127.0.0.1:8080
  logLevel: info
  shutdownTimeout: 30s
git:
  url: ./tmp/secrets.git
  branch: main
  root: generated
  cacheDir: ./tmp/cache
  tokenEnv: ESS_GIT_TOKEN
scope:
  projects: [example]
  environments: [prod, staging]
refresh:
  interval: 5m
  timeout: 2m
  retryMin: 5s
  retryMax: 5m
  maxStaleness: 0s
redis:
  enabled: false
  addresses: [localhost:6379]
  passwordEnv: ESS_REDIS_PASSWORD
  channel: ess:github-events
auth:
  readerTokenEnv: ESS_READER_TOKEN
  adminTokenEnv: ESS_ADMIN_TOKEN
limits:
  decryptWorkers: 4
  documentBytes: 1048576
  snapshotBytes: 33554432
