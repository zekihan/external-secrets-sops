services:
  external-secrets-sops:
    build: .
    command: [serve, --config, /config/config.yaml]
    ports: [127.0.0.1:8080:8080]
    env_file: .env
    environment:
      SOPS_AGE_KEY_FILE: /credentials/age.txt
    volumes:
      - ./docs/compose-config.yaml:/config/config.yaml:ro
      - ${SOPS_AGE_KEY_FILE:?Set SOPS_AGE_KEY_FILE}:/credentials/age.txt:ro
    tmpfs:
      - /data:uid=25000,gid=25000,mode=0700
    user: 25000:25000
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  redis:
    image: docker.io/redis:8.10.2@sha256:8aee6591ee8c2b26e9e01ad4913fbc804ea6b79a9bc675ee1824d80ea5dd9856
    command: [redis-server, --save, '', --appendonly, 'no']
