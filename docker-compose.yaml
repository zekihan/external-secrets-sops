services:
  external-secrets-sops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "33000:33000"
    env_file:
      - .env
    environment:
      SOPS_AGE_KEY_FILE: /run/secrets/age/key.txt
      ESS__REDIS_ADDRS: redis:6379
    volumes:
      - ./config.yaml:/config.yaml
      - ~/.config/sops/age/keys.txt:/run/secrets/age/key.txt:ro
    restart: unless-stopped

  redis:
    image: docker.io/redis:8.2.1@sha256:cc2dfb8f5151da2684b4a09bd04b567f92d07591d91980eb3eca21df07e12760
    ports:
      - "6379:6379"
    command: [ "redis-server" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
