services:
  external-secrets-sops:
    build: .
    command: [serve, --config, /config/config.yaml]
    ports: [127.0.0.1:8080:8080]
    env_file: .env
    environment:
      SOPS_AGE_KEY_FILE: /credentials/age.txt
    volumes:
      - type: bind
        source: ${ESS_CONFIG_FILE:-./docs/compose-config.yaml}
        target: /config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SOPS_AGE_KEY_FILE:?Set SOPS_AGE_KEY_FILE}
        target: /credentials/age.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ESS_TLS_CERT_FILE:?Set ESS_TLS_CERT_FILE}
        target: /credentials/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ESS_TLS_KEY_FILE:?Set ESS_TLS_KEY_FILE}
        target: /credentials/tls.key
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /data:uid=25000,gid=25000,mode=0700
    user: 25000:25000
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  redis:
    image: docker.io/redis:8.10.3@sha256:91cc9227bca4d2f717b1ad33d2ebba8127c16b0c2ca731dd9e6010d7629227a5
    command: [redis-server, --save, '', --appendonly, 'no']
