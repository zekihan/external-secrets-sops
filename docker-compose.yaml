services:
  external-secrets-sops:
    build: .
    command: [serve, --config, /config/config.yaml]
    ports: [127.0.0.1:8080:8080]
    env_file: .env
    environment:
      SOPS_AGE_KEY_FILE: /credentials/age.txt
    volumes:
      - ${ESS_CONFIG_FILE:-./docs/compose-config.yaml}:/config/config.yaml:ro
      - ${SOPS_AGE_KEY_FILE:?Set SOPS_AGE_KEY_FILE}:/credentials/age.txt:ro
      - ${ESS_TLS_CERT_FILE:?Set ESS_TLS_CERT_FILE}:/credentials/tls.crt:ro
      - ${ESS_TLS_KEY_FILE:?Set ESS_TLS_KEY_FILE}:/credentials/tls.key:ro
    tmpfs:
      - /data:uid=25000,gid=25000,mode=0700
    user: 25000:25000
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  redis:
    image: docker.io/redis:8.10.3@sha256:f245f4c83b84a9e9a0588da1c9456e579455310f0945d5db52cd2ba27f2000cc
    command: [redis-server, --save, '', --appendonly, 'no']
