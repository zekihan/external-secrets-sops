services:
  external-secrets-sops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "33000:33000"
    env_file:
      - .env
    environment:
      SOPS_AGE_KEY_FILE: /run/secrets/age/key.txt
      ESS__REDIS_ADDRS: redis:6379
    volumes:
      - ./config.yaml:/config.yaml
      - ~/.config/sops/age/keys.txt:/run/secrets/age/key.txt:ro
    restart: unless-stopped

  redis:
    image: docker.io/redis:8.2.1@sha256:c81b61a54d0df965bac57d6fdb59f6c95a8eee9295332f289287e880d5a4a498
    ports:
      - "6379:6379"
    command: [ "redis-server" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
