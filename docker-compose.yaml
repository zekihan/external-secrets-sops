services:
  external-secrets-sops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "33000:33000"
    env_file:
      - .env
    environment:
      SOPS_AGE_KEY_FILE: /run/secrets/age/key.txt
      ESS__REDIS_ADDRS: redis:6379
    volumes:
      - ./config.yaml:/config.yaml
      - ~/.config/sops/age/keys.txt:/run/secrets/age/key.txt:ro
    restart: unless-stopped

  redis:
    image: docker.io/redis:8.8.0@sha256:616f16a8f1e60d53f56379336df5cd769589a1cc7c1fa47ca0982a8d41fe52d1
    ports:
      - "6379:6379"
    command: [ "redis-server" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
